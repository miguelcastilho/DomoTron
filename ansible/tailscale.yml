---
- name: Enable access to /dev/tun
  hosts: pve
  gather_facts: no
  any_errors_fatal: true
  become: true
  tasks:
    - name: Ensure lxc.cgroup2.devices.allow is configured
      ansible.builtin.lineinfile:
        path: /etc/pve/lxc/102.conf
        regexp: '^lxc\.cgroup2\.devices\.allow:'
        line: 'lxc.cgroup2.devices.allow: c 10:200 rwm'
        insertafter: EOF
      notify: Restart container

    - name: Ensure lxc.mount.entry for /dev/tun is configured
      ansible.builtin.lineinfile:
        path: /etc/pve/lxc/102.conf
        regexp: '^lxc\.mount\.entry: /dev/net/tun'
        line: 'lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file'
        insertafter: EOF
      notify: Restart container

  handlers:
    - name: Restart container
      ansible.builtin.shell: |
        lxc-stop 102 && lxc-start 102

    # - name: Wait for changes to apply
    #   ansible.builtin.pause:
    #     seconds: 120

- name: Configure tailscale
  hosts: tailscale
  gather_facts: no
  any_errors_fatal: true
  vars_files:
    - ./tf_ansible_vars.yml
  pre_tasks:
    - name: Check if tf_ansible_vars.yml exists and is valid
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/tf_ansible_vars.yml"
      register: tf_vars_file
      delegate_to: localhost
      
    - name: Fail if tf_ansible_vars.yml does not exist
      ansible.builtin.fail:
        msg: "Required file tf_ansible_vars.yml not found. Please run Terraform first to generate this file."
      when: not tf_vars_file.stat.exists
      delegate_to: localhost
      
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
      register: connection_result
      
    - name: Gather facts for the first time
      ansible.builtin.setup:
      when: connection_result is success

  tasks:
    - name: Update all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: "dist"

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - curl
          - ethtool
        state: present

    - name: Stop and disable ufw
      ansible.builtin.service:
        name: ufw
        state: stopped
        enabled: false

    - name: Configure immediate ethtool settings
      ansible.builtin.shell: "ethtool -K {{ ansible_default_ipv4.interface }} rx-udp-gro-forwarding on rx-gro-list off"
      changed_when: false

    - name: Create network dispatcher script for tailscale optimization
      ansible.builtin.copy:
        dest: /etc/networkd-dispatcher/routable.d/50-tailscale
        content: |
          #!/bin/sh

          ethtool -K {{ ansible_default_ipv4.interface }} rx-udp-gro-forwarding on rx-gro-list off
        mode: '0755'

    # - name: Optimize for subenet routers and exit nodes
    #   ansible.builtin.shell: |
    #     set -o pipefail
    #     NETDEV=$(ip route show 0/0 | cut -f5 -d' ')
    #     ethtool -K $NETDEV rx-udp-gro-forwarding on rx-gro-list off
    #     printf '#!/bin/sh\n\nethtool -K %s rx-udp-gro-forwarding on rx-gro-list off \n' "$(ip route show 0/0 | cut -f5 -d" ")" | tee /etc/networkd-dispatcher/routable.d/50-tailscale
    #     chmod 755 /etc/networkd-dispatcher/routable.d/50-tailscale

    - name: Enable IP forwarding for tailscale
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/99-tailscale.conf
        line: "{{ item }}"
        create: true
        state: present
        mode: "0644"
      loop:
        - "net.ipv4.ip_forward = 1"
        - "net.ipv6.conf.all.forwarding = 1"
      notify: Reload sysctl

    - name: Check if tailscale is installed
      ansible.builtin.shell: "command -v tailscale"
      register: tailscale_check
      changed_when: false
      ignore_errors: true

    - name: Install tailscale if not present
      ansible.builtin.shell: "curl -fsSL https://tailscale.com/install.sh | sh"
      when: tailscale_check.rc != 0

    - name: Set network fact for tailscale configuration
      ansible.builtin.set_fact:
        ip_network: "{{ ansible_default_ipv4.address }}/{{ ansible_default_ipv4.netmask }}"

    - name: Set tailscale advertise routes
      ansible.builtin.set_fact:
        tailscale_advertise_routes: "{{ ip_network | ansible.utils.ipaddr('network/prefix') }}"

    - name: Create tailscale configuration file
      ansible.builtin.copy:
        dest: /etc/tailscale_config
        content: |
          authkey: {{ tf_tailscale_authkey }}
          advertise_routes: {{ tailscale_advertise_routes }}
          hostname: {{ tailscale_hostname }}
        mode: '0644'
      notify: Run tailscale up

    # - name: Run tailscale
    #   ansible.builtin.shell: |
    #     tailscale up --authkey={{ tf_tailscale_authkey }} --advertise-routes={{ tailscale_advertise_routes }} --hostname={{ tailscale_hostname }}

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-tailscale.conf

    - name: Run tailscale up
      ansible.builtin.shell: "tailscale up --authkey={{ tf_tailscale_authkey }} --advertise-routes={{ tailscale_advertise_routes }} --hostname={{ tailscale_hostname }}"