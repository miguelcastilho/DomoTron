---
- name: Add extra disk to mediabox
  hosts: pve
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Add disk
      ansible.builtin.shell: |
        qm set 101 -scsi1 /dev/disk/by-id/wwn-0x5000c500b604c053,backup=0

- name: Configure mediabox
  hosts: mediabox
  gather_facts: no
  any_errors_fatal: true
  vars_files:
    - ./tf_ansible_vars.yml
  pre_tasks:
    - name: Check if tf_ansible_vars.yml exists and is valid
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/tf_ansible_vars.yml"
      register: tf_vars_file
      delegate_to: localhost
      
    - name: Fail if tf_ansible_vars.yml does not exist
      ansible.builtin.fail:
        msg: "Required file tf_ansible_vars.yml not found. Please run Terraform first to generate this file."
      when: not tf_vars_file.stat.exists
      delegate_to: localhost
      
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
      register: connection_result
      
    - name: Gather facts for the first time
      ansible.builtin.setup:
      when: connection_result is success

  tasks:
    - name: Install dependencies
      ansible.builtin.include_role:
        name: mediabox

    - name: Set up and mount disk
      become: true
      block:
        - name: Create mount directory
          ansible.builtin.file:
            path: /mnt/HDD
            state: directory
            mode: "0755"

        - name: Mount disk
          ansible.posix.mount:
            path: /mnt/HDD
            src: /dev/sdb1
            fstype: ext4
            state: mounted
      rescue:
        - name: Cleanup mount directory on failure
          ansible.builtin.file:
            path: /mnt/HDD
            state: absent

    - name: Cloudflared
      ansible.builtin.include_role:
        name: cloudflared

    - name: CasaOS
      ansible.builtin.include_role:
        name: casaos

    - name: Apps
      ansible.builtin.include_role:
        name: apps
